<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBZ Reader</title>
<style>
:root{
  --bg:#f1f0ee; --panel:#e4e2de; --ink:#1d1c1a; --mute:#6b6862; --line:#cfccc6; --accent:#2f5d8a; --accent-ink:#fff;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --panel:#1c1c20; --ink:#e8e6e1; --mute:#8d8a84; --line:#2c2c32; --accent:#7fb0e0; --accent-ink:#0d1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --panel:#1c1c20; --ink:#e8e6e1; --mute:#8d8a84; --line:#2c2c32; --accent:#7fb0e0; --accent-ink:#0d1620;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,"Iowan Old Style","Palatino Linotype",serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#title{flex:1 1 8rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;color:var(--mute)}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:.3rem .65rem;cursor:pointer;min-height:2rem}
.btn:hover{border-color:var(--mute)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{display:flex;gap:.25rem}
#stage{flex:1;overflow:auto;position:relative;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}
#page{display:none;user-select:none;-webkit-user-drag:none}
#stage.w #page{width:100%;height:auto;max-width:100%}
#stage.h{align-items:center}
#stage.h #page{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
#stage.o #page{max-width:none}
#hit-l,#hit-r{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;display:none;z-index:2;-webkit-tap-highlight-color:transparent}
#hit-l{left:0}#hit-r{right:0}
#stage.open #hit-l,#stage.open #hit-r{display:block;position:fixed;top:auto;bottom:auto;height:calc(100% - 7rem);margin-top:3.5rem;opacity:0}
#empty{margin:auto;text-align:center;padding:2rem;max-width:26rem}
#empty h1{font-size:1.5rem;font-weight:normal;margin:0 0 .5rem}
#empty p{color:var(--mute);margin:.25rem 0 1.25rem}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);border:3px dashed var(--accent);font-size:1.4rem;z-index:10}
#drop.on{display:flex}
footer{display:none;align-items:center;gap:.75rem;padding:.5rem .75rem;background:var(--panel);border-top:1px solid var(--line)}
footer.on{display:flex}
#scrub{flex:1;accent-color:var(--accent);min-width:0}
#count{font-variant-numeric:tabular-nums;min-width:5.5rem;text-align:right}
#msg{color:#c0392b;min-height:1.2em;margin-top:.75rem}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:.55rem 1.1rem}
</style>
</head>
<body>
<header>
  <button class="btn" id="openBtn" type="button">Open file</button>
  <span id="title">No comic loaded</span>
  <div class="group" role="group" aria-label="Fit">
    <button class="btn" id="fw" type="button" aria-pressed="true" title="Fit width (1)">Width</button>
    <button class="btn" id="fh" type="button" aria-pressed="false" title="Fit height (2)">Height</button>
    <button class="btn" id="fo" type="button" aria-pressed="false" title="Original size (3)">Original</button>
  </div>
  <button class="btn" id="dir" type="button" aria-pressed="false" title="Right-to-left reading (r)">Manga mode</button>
  <button class="btn" id="fs" type="button" title="Fullscreen (f)">Fullscreen</button>
  <input id="file" type="file" accept=".cbz,.zip,application/vnd.comicbook+zip,application/zip" hidden>
</header>

<main id="stage" class="w">
  <div id="hit-l" aria-hidden="true"></div>
  <div id="hit-r" aria-hidden="true"></div>
  <div id="empty">
    <h1>Open a comic to start reading</h1>
    <p>Drop a .cbz file anywhere on this page, or choose one from your device. Files are read in your browser and are never uploaded.</p>
    <button class="btn primary" id="openBtn2" type="button">Choose a .cbz file</button>
    <div id="msg" role="status"></div>
  </div>
  <img id="page" alt="">
</main>

<footer id="foot">
  <button class="btn" id="prev" type="button" aria-label="Previous page">Prev</button>
  <input id="scrub" type="range" min="1" max="1" value="1" aria-label="Page">
  <span id="count">0 / 0</span>
  <button class="btn" id="next" type="button" aria-label="Next page">Next</button>
</footer>

<div id="drop">Drop your .cbz file to open it</div>

<script src="jszip.min.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var stage=$("stage"), img=$("page"), scrub=$("scrub"), msg=$("msg");
  var zip=null, names=[], idx=0, rtl=false, key="", cache={}, token=0;
  var MIME={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",avif:"image/avif",bmp:"image/bmp"};

  function store(get,k,v){ try{ return get ? localStorage.getItem(k) : localStorage.setItem(k,v); }catch(e){ return null; } }

  function extOf(n){ var m=/\.([a-z0-9]+)$/i.exec(n); return m ? m[1].toLowerCase() : ""; }

  async function load(file){
    msg.textContent="";
    try{
      var z = await JSZip.loadAsync(file);
      var list = Object.keys(z.files).filter(function(n){
        var f=z.files[n];
        return !f.dir && MIME[extOf(n)] && n.indexOf("__MACOSX")<0 && n.split("/").pop().charAt(0)!==".";
      });
      list.sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}); });
      if(!list.length){ throw new Error("empty"); }
      zip=z; names=list; cache={}; token++;
      key="cbz:"+file.name+":"+file.size;
      var saved=parseInt(store(true,key),10);
      idx = saved>=0 && saved<names.length ? saved : 0;
      $("title").textContent=file.name.replace(/\.(cbz|zip)$/i,"");
      $("title").style.fontStyle="normal"; $("title").style.color="var(--ink)";
      document.title=file.name+" – CBZ Reader";
      scrub.max=names.length;
      $("empty").style.display="none"; img.style.display="block";
      $("foot").classList.add("on"); stage.classList.add("open");
      show(idx);
    }catch(e){
      msg.textContent = e && e.message==="empty"
        ? "No images were found in that file."
        : "That file couldn’t be opened. CBZ files are ZIP archives; CBR (RAR) files aren’t supported.";
      $("empty").style.display="block";
    }
  }

  async function dataUrl(i){
    if(cache[i]) return cache[i];
    var n=names[i], b64=await zip.file(n).async("base64");
    var u="data:"+MIME[extOf(n)]+";base64,"+b64;
    cache[i]=u;
    var keys=Object.keys(cache);
    if(keys.length>8){ keys.sort(function(a,b){return Math.abs(b-i)-Math.abs(a-i)}); delete cache[keys[0]]; }
    return u;
  }

  async function show(i){
    if(!zip) return;
    idx=Math.max(0,Math.min(names.length-1,i));
    var my=++token, cur=idx;
    scrub.value=idx+1;
    $("count").textContent=(idx+1)+" / "+names.length;
    store(false,key,String(idx));
    var u=await dataUrl(cur);
    if(my!==token) return;
    img.src=u; img.alt="Page "+(cur+1);
    stage.scrollTo(0,0);
    if(cur+1<names.length) dataUrl(cur+1).catch(function(){});
    if(cur>0) dataUrl(cur-1).catch(function(){});
  }

  function step(d){ show(idx+d); }
  function fwd(){ step(1); }
  function back(){ step(-1); }

  $("next").onclick=fwd; $("prev").onclick=back;
  $("hit-l").onclick=function(){ rtl ? fwd() : back(); };
  $("hit-r").onclick=function(){ rtl ? back() : fwd(); };
  scrub.oninput=function(){ show(parseInt(scrub.value,10)-1); };

  function fit(mode){
    stage.classList.remove("w","h","o"); stage.classList.add(mode);
    $("fw").setAttribute("aria-pressed",mode==="w"); $("fh").setAttribute("aria-pressed",mode==="h"); $("fo").setAttribute("aria-pressed",mode==="o");
    stage.scrollTo(0,0);
  }
  $("fw").onclick=function(){fit("w")}; $("fh").onclick=function(){fit("h")}; $("fo").onclick=function(){fit("o")};

  function setRtl(v){
    rtl=v; $("dir").setAttribute("aria-pressed",v);
    $("prev").textContent = v ? "Next" : "Prev"; $("next").textContent = v ? "Prev" : "Next";
    $("prev").onclick = v ? fwd : back; $("next").onclick = v ? back : fwd;
    $("prev").setAttribute("aria-label", v ? "Next page" : "Previous page");
    $("next").setAttribute("aria-label", v ? "Previous page" : "Next page");
    scrub.style.direction = v ? "rtl" : "ltr";
    store(false,"cbz:rtl",v?"1":"0");
  }
  $("dir").onclick=function(){ setRtl(!rtl); };
  setRtl(store(true,"cbz:rtl")==="1");

  function toggleFs(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  }
  $("fs").onclick=toggleFs;

  var pick=function(){ $("file").click(); };
  $("openBtn").onclick=pick; $("openBtn2").onclick=pick;
  $("file").onchange=function(){ if(this.files[0]) load(this.files[0]); this.value=""; };

  document.addEventListener("keydown",function(e){
    if(e.target===scrub && (e.key==="ArrowLeft"||e.key==="ArrowRight")) return;
    var k=e.key;
    if(k==="ArrowRight"){ rtl?back():fwd(); }
    else if(k==="ArrowLeft"){ rtl?fwd():back(); }
    else if(k==="PageDown"||k===" "){ if(!e.shiftKey){ fwd(); } else back(); e.preventDefault(); }
    else if(k==="PageUp"){ back(); }
    else if(k==="Home"){ show(0); }
    else if(k==="End"){ show(names.length-1); }
    else if(k==="1"){ fit("w"); } else if(k==="2"){ fit("h"); } else if(k==="3"){ fit("o"); }
    else if(k==="r"){ setRtl(!rtl); }
    else if(k==="f"){ toggleFs(); }
    else if(k==="o" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); pick(); }
  });

  var depth=0, dz=$("drop");
  window.addEventListener("dragenter",function(e){ e.preventDefault(); depth++; dz.classList.add("on"); });
  window.addEventListener("dragleave",function(){ depth=Math.max(0,depth-1); if(!depth) dz.classList.remove("on"); });
  window.addEventListener("dragover",function(e){ e.preventDefault(); });
  window.addEventListener("drop",function(e){
    e.preventDefault(); depth=0; dz.classList.remove("on");
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) load(f);
  });
})();
</script>
</body>
</html>
